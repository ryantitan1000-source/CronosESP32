; Firmware de DIAGNÓSTICO (no es el firmware de acceso): puente transparente
; USB <-> lector DY50, para hablarle al lector desde la PC con tools/dy50_probe.py.
; GPIO4 (relé) queda en reposo, así que el molinete NO se activa.
;
;   pio run -d tools/diag_bridge -t upload
;   python tools/dy50_probe.py --port COM3 --out logs/img --poll 40
;
; Para volver al firmware normal, desde la raíz del proyecto:
;   pio run -e supermini_rele -t upload     (o -e supermini para simulación)
[env:diag_bridge]
platform = espressif32@7.1.3
board = esp32-c3-devkitm-1
framework = arduino
board_build.flash_mode = dio
board_upload.flash_size = 4MB
upload_port = COM3
upload_speed = 921600
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
