; CronosESP32 - Control de acceso con lector de huellas DY50
; Placa: ESP32-C3 SuperMini (ESP32-C3 QFN32 rev v0.4, 4 MB flash embebida XMC)
; Confirmado con esptool el 2026-10-01: USB-Serial/JTAG nativo, MAC 44:bd:8d:24:45:18

[platformio]
default_envs = supermini

[env]
platform = espressif32@7.1.3          ; trae Arduino-ESP32 2.0.17 (ESP-IDF 4.4)
board = esp32-c3-devkitm-1            ; no hay perfil "SuperMini"; mismo chip y flash
framework = arduino
board_build.flash_mode = dio          ; DIO: funciona con cualquier flash embebida
board_upload.flash_size = 4MB

; Puerto USB detectado: COM10 (VID 303A / PID 1001, USB-Serial/JTAG del ESP32-C3)
upload_port = COM10
monitor_port = COM10
test_port = COM10
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
monitor_echo = yes
monitor_eol = LF

build_flags =
    -DARDUINO_USB_MODE=1              ; Serial = USB-Serial/JTAG nativo (HWCDC)
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
build_src_flags = -Wall -Wextra

; Firmware principal. El rele esta DESHABILITADO (modo simulacion) hasta
; verificar la interfaz electrica. Ver include/config.h y README.md.
; Pruebas en la placa (sin lector):  pio test -e supermini
[env:supermini]
test_ignore = test_hw_*

; Prueba de integracion con el lector DY50 real conectado:  pio test -e hwtest
[env:hwtest]
extends = env:supermini
test_ignore =
test_filter = test_hw_*
